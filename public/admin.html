<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Administrativo - Galería de Arte</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="admin-shell">
    <header class="admin-header">
      <h1>Panel administrativo</h1>
      <p>Aprueba obras, rechaza envíos y revisa el ranking de votos.</p>
    </header>

    <section class="admin-controls">
      <label>Token administrativo</label>
      <input id="adminToken" type="password" placeholder="Introduce tu token" />
      <button id="loadPendingButton">Cargar pendientes</button>
      <button id="loadApprovedButton">Ver obras subidas</button>
      <button id="loadAllButton">Ver todas las obras</button>
      <button id="loadRankingButton">Ver ranking</button>
    </section>

    <section class="admin-upload">
      <h2>Subir obra como administrador</h2>
      <div class="submission-form" id="adminUploadForm">
        <input id="uploadTitle" type="text" placeholder="Título de la obra" />
        <input id="uploadFirstName" type="text" placeholder="Nombre del autor" />
        <input id="uploadLastName" type="text" placeholder="Apellido del autor" />
        <input id="uploadCategory" type="text" placeholder="Categoría" />
        <input id="uploadYear" type="text" placeholder="Año (opcional)" />
        <input id="uploadMedium" type="text" placeholder="Técnica o medio (opcional)" />
        <textarea id="uploadDescription" rows="4" placeholder="Descripción de la obra"></textarea>
        <input id="uploadImageUrl" type="url" placeholder="URL de imagen (opcional si subes archivo)" />
        <input id="uploadFile" type="file" accept="image/*" />
        <button id="uploadButton">Subir obra</button>
      </div>
    </section>

    <section id="adminContent" class="admin-content"></section>
    <div id="adminMessage" class="form-message"></div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
