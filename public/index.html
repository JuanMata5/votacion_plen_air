<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galería de Arte - Convención</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <p class="eyebrow">Convención de Arte</p>
      <h1>Vota por tu obra favorita</h1>
      <p>Descubre artistas emergentes, vota sin registrarte y explora el ranking.</p>
    </div>
  </header>

  <main class="layout">
    <section class="controls-panel">
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="Buscar por título o descripción" />
      </div>
      <div class="filters">
        <select id="categoryFilter">
          <option value="">Todas las categorías</option>
          <option value="Pintura">Pintura</option>
          <option value="Ilustración">Ilustración</option>
          <option value="Fotografía">Fotografía</option>
          <option value="Escultura">Escultura</option>
        </select>
        <input id="artistFilter" type="text" placeholder="Buscar por artista" />
      </div>
    </section>

    <section class="submission-section">
      <div class="section-header">
        <h2>Correo para votar</h2>
        <p>Debes ingresar tu email antes de poder votar por las obras.</p>
      </div>
      <div class="submission-card">
        <form id="voteEmailForm" class="submission-form">
          <label>Tu correo</label>
          <input type="email" id="voteEmail" placeholder="tu@email.com" required />
          <button type="submit">Guardar correo</button>
        </form>
        <div id="emailSavedMessage" class="form-message"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
